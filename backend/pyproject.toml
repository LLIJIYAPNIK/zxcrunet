[project]
name = "zxcrunet"
version = "0.1.0"
description = "zxcrunet — платформа сайтов-визиток (backend)"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.162.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zxcrunet"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "TID", "PL"]
# RUF001-003: Russian text is expected; PLR0917: DI constructors and FastAPI endpoints.
ignore = ["PLR0913", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"migrations/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["zxcrunet", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: требует запущенных Postgres и Redis"]

# Локальное окружение: docker compose -f infra/docker-compose.dev.yml up -d
name: zxcrunet-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zxc
      POSTGRES_PASSWORD: zxc
      POSTGRES_DB: zxc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zxc -d zxc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # веб-интерфейс: http://localhost:8025

  # Optional: HTTPS and custom domains locally (--profile caddy). The app runs on the host.
  caddy:
    image: caddy:2.10.2
    profiles: ["caddy"]
    environment:
      API_UPSTREAM: host.docker.internal:8000
      WEB_UPSTREAM: host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgres-data:
  redis-data:
  caddy-data:
